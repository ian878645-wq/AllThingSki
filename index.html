<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllThingsSki</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-section">
        <img src="images\Screenshot 2026-03-06 132313.png" alt="Logo" class="logo">
        <h1>Welcome to AllThingsSki!</h1>
        <p>Your one-stop destination for all things skiing. Whether you're a beginner or a seasoned pro, we've got you covered with the latest news, tips, and gear reviews.</p>

        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search for ski tips, gear, or destinations..." class="search-input">
        </div>

        <div class="dropdowns-row">
            <div class="dropdown-group">
                <label for="dropdown1">Filter by skill:</label>
                <select id="dropdown1" class="filter-dropdown">
                    <option value="">Select Level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
            <div class="dropdown-group">
                <label for="dropdown2">Filter by location:</label>
                <select id="dropdown2" class="filter-dropdown">
                    <option value="">Select Location</option>
                    <option value="us">United States</option>
                    <option value="canada">Canada</option>
                    <option value="europe">Europe</option>
                </select>
            </div>
            <div class="dropdown-group">
                <label for="dropdown3">Filter by season:</label>
                <select id="dropdown3" class="filter-dropdown">
                    <option value="">Select Season</option>
                    <option value="winter">Winter</option>
                    <option value="spring">Spring</option>
                    <option value="summer">Summer</option>
                </select>
            </div>
        </div>
    </div>

    <div class="bottom-section">
    </div>

    <script src="script.js"></script>
</body>
</html>
